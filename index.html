            background-color: rgba(0, 123, 255, 0.7); /* Semi-transparent button color */

            transition: background-color 0.3s, transform 0.3s; /* Add transition for background and transform */
        }
        button:hover {
            background-color: rgba(180, 38, 33, 0.7); /* Semi-transparent button hover color */
            animation: bounce 0.5s; /* Trigger bounce animation */
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
